name: Czujka schematu FA(3)

# Plan usprawnień 3.4: raz w tygodniu porównuje schemat FA(3) w MF (crd.gov.pl
# i CIRFMF/ksef-api, dawniej ksef-docs) z `lib/xml/schemas/fa3/`. Różnica = issue z etykietą
# `czujka-fa3` (jedno na wersję MF). MF niedostępny = ostrzeżenie, bez issue
# i bez czerwieni. Bez pull_request: przerwa po stronie MF nie może blokować scalania.
on:
  schedule:
    # Wtorek 05:23 UTC: dzień po teście KSeF TEST (poniedziałek), poza godziną pełną.
    - cron: '23 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: czujka-schematu-fa3
  cancel-in-progress: false

jobs:
  czujka:
    name: Schemat FA(3) w MF a repo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Porównanie i issue
        run: node scripts/ci/czujka-schematu-fa3.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
