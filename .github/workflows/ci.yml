name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Plan usprawnień 2.8: Vitest jedzie szeregowo (vitest.config.ts), więc dzielimy
  # go na 3 maszyny, a typy, lint i reszta testów idą obok. Wymagana kontrola
  # „Typecheck + Lint + Unit tests” zostaje pod tą samą nazwą i zbiera wyniki
  # (reguły gałęzi main bez zmian).
  static:
    name: Typy, lint, testy tsx i node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install XML schema validator
        # Zapasowy serwer pakietów przy awarii mirrora Azure (11.11.2026).
        run: bash scripts/ci/zainstaluj-xmllint.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      # Plan usprawnień 4.6: przyrostowy tsc (`incremental` w tsconfig.json
      # pisze tsconfig.tsbuildinfo) i cache ESLinta (strategia `content`
      # w package.json, bo świeży checkout zmienia czasy plików). Oba porównują
      # treść plików, więc stary cache najwyżej nic nie przyspieszy, nie da
      # fałszywie zielonego wyniku. Klucz od lockfile i konfiguracji: po zmianie
      # zależności zaczynamy od zera, w obrębie tego samego lockfile bierzemy
      # najnowszy zapis (restore-keys).
      - name: Cache tsc i ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tsconfig.tsbuildinfo
            .tmp/eslintcache
          key: tsc-eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            tsc-eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json', 'eslint.config.mjs') }}-
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Testy tsx (generator, kalkulator i walidator FA(3))
        run: pnpm run test
        # Bez sekretów aplikacji i bez dostępu do bazy.
      - name: Test CodeQL gate and safe diagnostics
        run: node --test scripts/security/check-codeql-results.test.mjs scripts/security/print-codeql-locations.test.mjs
      - name: Test agent guard rules
        run: node --test scripts/ci/agent-guard.test.mjs
      - name: Test Telegram gate (ops/bramka)
        run: node --test ops/bramka/test/*.test.mjs
      - name: Test support mail worker (ops/poczta)
        run: node --test ops/poczta/worker.test.mjs

  vitest:
    name: Vitest (część ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install XML schema validator
        # Zapasowy serwer pakietów przy awarii mirrora Azure (11.11.2026).
        run: bash scripts/ci/zainstaluj-xmllint.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest, część ${{ matrix.shard }} z 3
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/3
        # Bez sekretów aplikacji i bez dostępu do bazy.

  ci:
    name: Typecheck + Lint + Unit tests
    needs: [static, vitest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Wynik części
        env:
          STATIC: ${{ needs.static.result }}
          VITEST: ${{ needs.vitest.result }}
        run: |
          echo "typy, lint, tsx: $STATIC; vitest (3 części): $VITEST"
          [ "$STATIC" = success ] && [ "$VITEST" = success ]

  # AUD-108: błąd builda (np. plik 'use server' eksportujący nie-funkcję) wychodził
  # dopiero przy 12–18-minutowym wdrożeniu w Coolify. Typecheck tego nie łapie.
  build:
    name: Next build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Docker context excludes local operator files
        run: |
          node --test scripts/security/check-docker-context.test.mjs
          node scripts/security/check-docker-context.mjs
        # Tylko syntetyczny kontekst FROM scratch; brak sekretów i obrazu bazowego.
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Ten sam pułap sterty co build produkcyjny (Dockerfile). Z domyślną
          # stertą runnera (~4 GB) CI przechodziło, a build na app-1 padał
          # z „heap out of memory” (20.10.2026). Strażnik: tests/unit/build-pamiec-sterty.test.ts.
          # 11.11.2026: 5120 MB, gałąź zbiorcza z 30 PR przekracza 4096 MB.
          NODE_OPTIONS: '--max-old-space-size=5120'
        # Bez sekretów aplikacji — build ma przechodzić bez nich (jak lokalnie).
      # Plan usprawnień 4.5: Next 16 nie wypisuje już „First Load JS”, więc
      # skrypt liczy go z plików .next (gzip, per trasa) i porównuje z progiem
      # w scripts/ci/budzet-js.json. Test logiki: tests/unit/budzet-js.test.ts.
      - name: Budżet First Load JS
        run: node scripts/ci/budzet-js.mjs .next scripts/ci/budzet-js.json

  # AUD-109: izolacja firm (RLS) sprawdzana przed scaleniem, na lokalnym
  # Supabase z migracjami z repo — bez sekretów i bez dostępu do produkcji.
  rls:
    name: RLS isolation (lokalny Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Supabase + migracje + testy RLS
        run: scripts/ci/rls-local.sh

  # Krok 7 planu automatyzacji: testy z PR agenta kodu muszą PAŚĆ na kodzie
  # bazowym (scripts/ci/test-first.sh). PR ludzi: job kończy się od razu.
  test-first:
    name: Test-first (agent)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect agent PR
        id: detect
        run: node scripts/ci/agent-guard.mjs detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.detect.outputs.run == 'true'
        with:
          version: 10.34.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.detect.outputs.run == 'true'
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: |
          bash scripts/ci/zainstaluj-xmllint.sh
          pnpm install --frozen-lockfile
      - name: New tests must fail on base
        if: steps.detect.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TESTS: ${{ steps.detect.outputs.tests }}
        # TESTS zawiera wyłącznie ścieżki przefiltrowane przez agent-guard.mjs.
        run: |
          read -r -a files <<< "$TESTS"
          ./scripts/ci/test-first.sh "$BASE_SHA" "${files[@]}"

  offline-inventory:
    name: Offline security inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Test isolated report generation
        run: node --test scripts/security/offline-audit-output.test.mjs
      - name: Generate inventories without application services
        run: |
          node scripts/security/audit-service-role.ts --output-dir "$RUNNER_TEMP/security-inventory/service-role"
          node scripts/security/inventory-entrypoints.ts --output-dir "$RUNNER_TEMP/security-inventory/entrypoints"
        # Bez zależności aplikacji, sekretów i publikacji surowych raportów.
        # Sukces oznacza wygenerowanie spisu, nie brak podatności.

  # Job może zakończyć się błędem; wymaganie go przed merge ustawia ruleset.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
