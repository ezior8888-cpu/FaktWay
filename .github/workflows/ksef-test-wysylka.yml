name: KSeF TEST (wysyłka)

# Plan „zero zgubionych faktur”, sesja H1a: prawdziwa wysyłka na KSeF TEST raz w tygodniu.
# Bez sekretów: fikcyjny NIP i certyfikat samopodpisany powstają w locie.
# Bez pull_request: to test zewnętrznego systemu, a jego przerwa nie może blokować scalania.
on:
  schedule:
    # Poniedziałek 06:17 UTC, poza oknem serwisowym KSeF TEST (16:00-18:00).
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wysylka:
    name: Wysyłka na KSeF TEST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Scenariusze na KSeF TEST
        run: pnpm ksef:test-wysylka
