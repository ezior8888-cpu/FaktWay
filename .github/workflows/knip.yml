name: Knip (raport tygodniowy)

# Plan usprawnień 4.4: nieużywane pliki, eksporty i zależności (knip.jsonc).
# Tylko raport w podsumowaniu przebiegu, nigdy czerwień: znaleziska nie
# blokują niczego, a decyzję o usunięciu kodu podejmuje człowiek w osobnym PR.
# Bez pull_request, żeby nie dokładać kontroli do PR.
on:
  schedule:
    # Poniedziałek 05:41 UTC (6:41 zimą, 7:41 latem w Warszawie), poza godziną pełną.
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knip-raport
  cancel-in-progress: true

jobs:
  knip:
    name: Raport Knip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Knip do podsumowania przebiegu
        # --no-exit-code: znaleziska nie zmieniają wyniku joba. Czerwień tylko
        # wtedy, gdy sam knip się wywróci (np. zła konfiguracja).
        run: |
          pnpm -s knip --no-progress --reporter markdown --no-exit-code > knip-raport.md
          {
            echo "Raport, nie blokada (plan usprawnień 4.4). Konfiguracja: \`knip.jsonc\`, lokalnie \`pnpm knip\`."
            echo
            if [ -s knip-raport.md ]; then cat knip-raport.md; else echo "Knip nic nie znalazł."; fi
          } >> "$GITHUB_STEP_SUMMARY"
