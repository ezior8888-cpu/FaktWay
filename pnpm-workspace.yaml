  'uuid@<11.1.1': '>=11.1.1'
  '@protobufjs/utf8@<1.1.1': '>=1.1.2'
  '@opentelemetry/auto-instrumentations-node@<0.75.0': '>=0.83.0'
  '@opentelemetry/sdk-node@<0.217.0': '>=0.301.0'
