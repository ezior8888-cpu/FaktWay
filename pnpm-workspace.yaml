  '@simplewebauthn/server>@peculiar/asn1-schema': '^2.11.1'
  '@grpc/proto-loader>protobufjs': '>=8.8.1'
  '@aws-sdk/xml-builder>fast-xml-parser': '>=5.12.0'
  'fast-xml-builder@<1.1.7': '>=1.3.1'
  'protobufjs@<8.6.0': '>=8.8.1'
